<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deco Plotter</title>
<style>
  :root { color-scheme: dark; --bg:#111217; --panel:#181b1f; --border:#2c3235; --fg:#ccccdc; --dim:#8e8e9e; --down:#73bf69; --up:#5794f2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,Segoe UI,sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; margin-right:auto; }
  select, button { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:5px 8px; font:inherit; }
  #status { color:var(--dim); font-size:12px; }
  #status.err { color:#f2495c; }
  main { display:grid; grid-template-columns:1fr; gap:16px; padding:16px; }
  section { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:12px 16px; }
  .head { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .head h2 { font-size:15px; margin:0; margin-right:auto; }
  .stat { font-variant-numeric:tabular-nums; }
  .stat b { font-size:16px; }
  .down { color:var(--down); } .up { color:var(--up); }
  .chart { position:relative; height:300px; }
  .sub { color:var(--dim); font-size:12px; margin-top:6px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Deco Plotter</h1>
  <label>Range
    <select id="range">
      <option value="15">15 min</option>
      <option value="60" selected>1 hour</option>
      <option value="360">6 hours</option>
      <option value="1440">24 hours</option>
      <option value="10080">7 days</option>
    </select>
  </label>
  <span id="status">connecting…</span>
</header>
<main>
  <section>
    <div class="head">
      <h2>Router (WAN, sum of all clients)</h2>
      <span class="stat">▼ <b class="down" id="r-down">–</b></span>
      <span class="stat">▲ <b class="up" id="r-up">–</b></span>
    </div>
    <div class="chart"><canvas id="routerChart"></canvas></div>
    <div class="sub" id="r-sub"></div>
  </section>
  <section>
    <div class="head">
      <h2>Device</h2>
      <select id="device"></select>
      <span class="stat">▼ <b class="down" id="d-down">–</b></span>
      <span class="stat">▲ <b class="up" id="d-up">–</b></span>
    </div>
    <div class="chart"><canvas id="deviceChart"></canvas></div>
    <div class="sub" id="d-sub"></div>
  </section>
</main>
<script src="lib/chart.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
