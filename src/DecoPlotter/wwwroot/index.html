<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deco Plotter</title>
<style>
  :root { color-scheme: dark; --bg:#111217; --panel:#181b1f; --border:#2c3235; --fg:#ccccdc; --dim:#8e8e9e; --down:#73bf69; --up:#5794f2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,Segoe UI,sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; margin-right:auto; }
  select, button { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:5px 8px; font:inherit; }
  #status { color:var(--dim); font-size:12px; }
  #status.err { color:#f2495c; }
  main { display:grid; grid-template-columns:1fr; gap:16px; padding:16px; }
  section { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:12px 16px; }
  .head { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .head h2 { font-size:15px; margin:0; margin-right:auto; }
  .stat { font-variant-numeric:tabular-nums; }
  .stat b { font-size:16px; }
  .down { color:var(--down); } .up { color:var(--up); }
  .chart { position:relative; height:300px; }
  .sub { color:var(--dim); font-size:12px; margin-top:6px; font-variant-numeric:tabular-nums; }
  .table-wrap { max-height:420px; overflow:auto; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--border); }
  th { cursor:pointer; position:sticky; top:0; background:var(--panel); user-select:none; }
  th.sorted-asc::after { content:" ▲"; } th.sorted-desc::after { content:" ▼"; }
  .num { text-align:right; }
  tbody tr { cursor:pointer; } tbody tr:hover { background:#ffffff0a; }
  input[type=date] { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:4px 6px; font:inherit; }
</style>
</head>
<body>
<header>
  <h1>Deco Plotter</h1>
  <label>Range
    <select id="range">
      <option value="15">15 min</option>
      <option value="60" selected>1 hour</option>
      <option value="360">6 hours</option>
      <option value="1440">24 hours</option>
      <option value="10080">7 days</option>
    </select>
  </label>
  <span id="status">connecting…</span>
</header>
<main>
  <section>
    <div class="head">
      <h2>Router (WAN, sum of all clients)</h2>
      <span class="stat">▼ <b class="down" id="r-down">–</b></span>
      <span class="stat">▲ <b class="up" id="r-up">–</b></span>
    </div>
    <div class="chart"><canvas id="routerChart"></canvas></div>
    <div class="sub" id="r-sub"></div>
  </section>
  <section>
    <div class="head">
      <h2>Device</h2>
      <label>Sort
        <select id="sortBy">
          <option value="name">Name</option>
          <option value="ip">IP address</option>
          <option value="down">Download rate</option>
        </select>
      </label>
      <select id="sortDir">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
      </select>
      <select id="device"></select>
      <span class="stat">▼ <b class="down" id="d-down">–</b></span>
      <span class="stat">▲ <b class="up" id="d-up">–</b></span>
    </div>
    <div class="chart"><canvas id="deviceChart"></canvas></div>
    <div class="sub" id="d-sub"></div>
  </section>
  <section>
    <div class="head">
      <h2>Data usage</h2>
      <select id="u-range">
        <option value="today">Today</option>
        <option value="yesterday">Yesterday</option>
        <option value="week">This week</option>
        <option value="month" selected>This month</option>
        <option value="last7">Last 7 days</option>
        <option value="last30">Last 30 days</option>
        <option value="custom">Custom…</option>
      </select>
      <span id="u-custom" hidden>
        <input type="date" id="u-from"> – <input type="date" id="u-to">
      </span>
    </div>
    <div class="sub" id="u-router"></div>
    <div class="table-wrap">
      <table id="u-table">
        <thead>
          <tr>
            <th data-k="name">Device</th><th data-k="ip">IP</th>
            <th data-k="down" class="num">Downloaded</th><th data-k="up" class="num">Uploaded</th><th data-k="total" class="num">Total</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="sub">Estimated from the router's reported speeds. Totals are kept per calendar day (server local time) and are not purged.</div>
  </section>
</main>
<script src="lib/chart.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
